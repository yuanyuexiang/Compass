name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: yuanyuexiang

jobs:
  backend:
    name: 后端（lint + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装依赖
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests scripts
      - name: 测试
        run: uv run pytest -q

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci --no-fund --no-audit
      - name: 构建
        run: npm run build

  # 以下两个 job 仅在 master push / 手动触发时运行，且必须等测试全绿（PR 时自动跳过）
  build-and-push:
    name: 构建并推送镜像
    if: github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: 构建推送 backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # 阿里云 ACR 暂不接受 BuildKit provenance/SBOM 的 OCI 附加清单
          # （application/vnd.oci.empty.v1+json），仅推送普通容器镜像。
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/compass-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/compass-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: 构建推送 frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/compass-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/compass-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: 部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<'EOF'
          Host compass-deploy
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 15
            ServerAliveCountMax 12
            TCPKeepAlive yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 同步部署文件
        run: |
          ssh compass-deploy 'mkdir -p /opt/compass'
          scp deploy/docker-compose.prod.yml deploy/.env.production.example \
            compass-deploy:/opt/compass/
      - name: 执行部署
        run: |
          for attempt in 1 2 3; do
            echo "部署尝试 ${attempt}/3"
            set +e
            ssh compass-deploy \
              "REGISTRY='${{ env.REGISTRY }}' NAMESPACE='${{ env.NAMESPACE }}' TAG='${{ github.sha }}' \
               REGISTRY_USERNAME='${{ secrets.REGISTRY_USERNAME }}' REGISTRY_PASSWORD='${{ secrets.REGISTRY_PASSWORD }}' \
               bash -s" < deploy/deploy.sh
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 255 ] || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "SSH 连接中断，10 秒后重连；Docker 将复用已下载的镜像层。"
            sleep 10
          done
